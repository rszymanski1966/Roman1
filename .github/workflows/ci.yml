name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# One run per workflow and ref. A newer push to a PR cancels the older run; runs on main are never cancelled
# (a deploy in progress finishes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static checks, unit tests and the build. No Supabase stack. The job name is the status-check context the
  # ruleset on main requires: keep it `checks`.
  checks:
    name: checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx astro sync

      - run: npm run lint

      - run: npm run lint:ui

      - run: npm run lint:db-access

      - run: npm run test:unit

      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # Tests against a local Supabase stack on the runner and a dev server. No `npm run build` here: the build and the
  # dev server share the Vite cache. The job name is the status-check context the ruleset on main requires: keep it
  # `integration`.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Also installs the Supabase CLI (devDependency `supabase`), so no supabase/setup-cli.
      - run: npm ci

      # CI only: one full run makes about 27 sign-ups/sign-ins, close to the local limit of 30 per 5 minutes.
      # Changes the runner's checkout only; the committed config.toml stays at 30.
      - name: Raise the auth rate limit (CI only)
        run: |
          sed -i 's/^sign_in_sign_ups = 30$/sign_in_sign_ups = 300/' supabase/config.toml
          if [ "$(grep -cx 'sign_in_sign_ups = 300' supabase/config.toml)" != "1" ] \
            || grep -qx 'sign_in_sign_ups = 30' supabase/config.toml; then
            echo "::error file=supabase/config.toml::Replacing sign_in_sign_ups = 30 with 300 failed"
            exit 1
          fi

      - name: Start the local Supabase stack
        run: npx supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # The status output holds the keys: it goes to a temp file, never to the log. Every secret value is masked
      # before anything else runs.
      - name: Write .dev.vars from the local stack
        run: |
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT
          npx supabase status -o env > "$status_file"
          # First KEY=value line for the given key, surrounding double quotes removed (the CLI may quote values).
          value() {
            awk -v key="$1" '{ sub(/^[ \t]+/, "") }
              index($0, key "=") == 1 { v = substr($0, length(key) + 2); sub(/^"/, "", v); sub(/"$/, "", v); print v; exit }' \
              "$status_file"
          }
          for name in PUBLISHABLE_KEY ANON_KEY SECRET_KEY SERVICE_ROLE_KEY DB_URL JWT_SECRET \
            S3_PROTOCOL_ACCESS_KEY_ID S3_PROTOCOL_ACCESS_KEY_SECRET; do
            secret="$(value "$name")"
            if [ -n "$secret" ]; then echo "::add-mask::$secret"; fi
          done
          url="$(value API_URL)"
          key="$(value PUBLISHABLE_KEY)"
          if [ -z "$key" ]; then key="$(value ANON_KEY)"; fi
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::npx supabase status -o env returned no API_URL or publishable/anon key"
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_KEY=%s\n' "$url" "$key" > .dev.vars

      - run: npm test

      - run: npx supabase test db

      # ASTRO_DEV_BACKGROUND=1 keeps `astro dev` in its normal foreground mode: it skips the AI-agent detection that
      # would otherwise switch the dev server to background mode. A cold start takes about a minute.
      - name: Start the dev server
        env:
          ASTRO_DEV_BACKGROUND: "1"
        run: |
          nohup npm run dev > dev-server.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -fsS -o /dev/null --max-time 5 http://localhost:4321/; then
              # A few seconds of slack after the first 200, for the dev server to settle.
              sleep 5
              exit 0
            fi
            sleep 1
          done
          echo "::error::The dev server did not answer 200 on http://localhost:4321/ within 180 s"
          tail -n 100 dev-server.log
          exit 1

      - run: npm run test:http

      - run: npm run smoke
        env:
          BASE_URL: http://localhost:4321

      - name: Upload the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: dev-server.log
          if-no-files-found: ignore

  deploy:
    name: deploy
    needs: [checks, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx astro sync

      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
